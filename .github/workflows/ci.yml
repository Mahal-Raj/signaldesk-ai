name: model-and-security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m signaldesk.evaluate
      - run: docker build -t signaldesk:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: signaldesk:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
